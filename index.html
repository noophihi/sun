<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 제이메디 카달로그</title>
    <!-- 오픈그래프(OG) 메타 태그: 링크 공유 시 명함 이미지가 미리보기로 노출되도록 설정 -->
    <meta property="og:title" content="2026 제이메디 카달로그">
    <meta property="og:description" content="제이메디 모바일 카달로그 및 책자 링크 안내입니다.">
    <meta property="og:image" content="business-card.png">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        /* 명함 카드 영역 */
        .card-box {
            background: #ffffff;
            border: 1px solid #e1e4e8;
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .card-image-wrap {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #eee;
        }
        .card-image-wrap img {
            width: 100%;
            height: auto;
            display: block;
        }
        .card-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 13px;
            color: #444;
            border-left: 3px solid #0056b3;
            padding-left: 10px;
        }
        .card-info .title-pos {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .card-info .name {
            font-size: 16px;
            font-weight: 700;
            color: #111;
            margin-bottom: 2px;
        }
        
        /* 헤더 섹션 */
        .header-section {
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        h1 {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 6px;
        }
        p {
            font-size: 13px;
            color: #666;
            line-height: 1.4;
        }

        /* 카테고리 필터 버튼 영역 */
        .filter-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .filter-btn {
            flex: 1;
            padding: 10px 0;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: #0056b3;
            color: #fff;
            border-color: #0056b3;
        }

        /* 카달로그 링크 버튼 영역 */
        .catalog-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .catalog-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            text-decoration: none;
            color: #333;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s, transform 0.1s;
        }
        .catalog-btn:hover {
            background: #e9ecef;
        }
        .catalog-btn span {
            color: #0056b3;
            font-size: 12px;
        }

        /* 맥 UI 스타일 하단 폴더 (SNS 채널) */
        .mac-folder {
            background: #e4e7eb;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 10px;
        }
        .sns-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #333;
            font-size: 11px;
            gap: 4px;
            transition: transform 0.2s;
        }
        .sns-icon:hover {
            transform: translateY(-3px);
        }
        .sns-icon img {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 명함 카드 UI 영역 -->
        <div class="card-box">
            <div class="card-image-wrap">
                <!-- 명함 이미지 파일명 (business-card.png) -->
                <img src="business-card.png" alt="이선영 약사 명함">
            </div>
            <div class="card-info">
                <span class="title-pos">Pharmacist</span>
                <span class="name">Lee Sun young (이선영)</span>
                <div><strong>Mobile:</strong> 010-6596-0067</div>
                <div><strong>Mail:</strong> jmedi6119@naver.com</div>
                <div><strong>Address:</strong> 1F, JMedi, 839 Nakdong-daero, Sasang-gu, Busan, South Korea</div>
            </div>
        </div>

        <!-- 안내 타이틀 -->
        <div class="header-section">
            <h1>2026 제이메디 카달로그</h1>
            <p>원하시는 모바일 책자를 선택해 주세요.</p>
        </div>

        <!-- 제품별 카테고리 필터 버튼 -->
        <div class="filter-buttons">
            <button class="filter-btn active" onclick="filterCatalog('all')">전체 보기</button>
            <button class="filter-btn" onclick="filterCatalog('catalog1')">제이메디 책자</button>
            <button class="filter-btn" onclick="filterCatalog('catalog2')">역매품 책자</button>
        </div>

        <!-- 카달로그 링크 버튼 목록 -->
        <div class="catalog-links">
            <a href="catalog1.pdf" class="catalog-btn item-catalog1" target="_blank">
                <div>2026 제이메디 통합 카달로그</div>
                <span>PDF 보기 &rarr;</span>
            </a>
            <a href="catalog2.pdf" class="catalog-btn item-catalog2" target="_blank">
                <div>2026 역매품 전용 책자</div>
                <span>PDF 보기 &rarr;</span>
            </a>
        </div>

        <!-- 맥 UI 스타일 하단 SNS 폴더 영역 -->
        <div class="mac-folder">
            <a href="https://youtube.com" class="sns-icon" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube">
                <span>YouTube</span>
            </a>
            <a href="https://facebook.com" class="sns-icon" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/1384/1384053.png" alt="Facebook">
                <span>Facebook</span>
            </a>
            <a href="https://instagram.com" class="sns-icon" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/1384/1384063.png" alt="Instagram">
                <span>Instagram</span>
            </a>
            <a href="https://tiktok.com" class="sns-icon" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" alt="TikTok">
                <span>TikTok</span>
            </a>
        </div>
    </div>

    <script>
        // 카테고리 필터링 기능 스크립트
        function filterCatalog(type) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const item1 = document.querySelector('.item-catalog1');
            const item2 = document.querySelector('.item-catalog2');

            if (type === 'all') {
                item1.style.display = 'flex';
                item2.style.display = 'flex';
            } else if (type === 'catalog1') {
                item1.style.display = 'flex';
                item2.style.display = 'none';
            } else if (type === 'catalog2') {
                item1.style.display = 'none';
                item2.style.display = 'flex';
            }
        }
    </script>
</body>
</html>
