<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제이메디 모바일 책자</title>
    
    <!-- 카카오톡 등 링크 공유 시 배너에 노출될 이미지만 명함 이미지로 설정 -->
    <meta property="og:title" content="2026 제이메디 카달로그">
    <meta property="og:description" content="모바일 책자를 보시려면 링크를 클릭해주세요.">
    <meta property="og:image" content="https://noophihi.github.io/sun/business-card.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #f7f9fc;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            padding: 30px 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        /* 기존 명함 영역 디자인 */
        .card-box {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .card-logo {
            width: 100px;
            flex-shrink: 0;
        }
        .card-logo img {
            width: 100%;
            height: auto;
            display: block;
        }
        .card-divider {
            width: 1px;
            height: 80px;
            background-color: #cbd5e1;
        }
        .card-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 12px;
            color: #475569;
        }
        .card-info .name {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 2px;
        }
        
        /* 헤더 섹션 */
        .header-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        h1 {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
        }
        p {
            font-size: 14px;
            color: #64748b;
            line-height: 1.5;
        }
        .main-link {
            font-size: 14px;
            color: #2563eb;
            text-decoration: underline;
            font-weight: 600;
            word-break: break-all;
        }

        /* 카테고리 필터 버튼 영역 */
        .filter-buttons {
            display: flex;
            gap: 8px;
        }
        .filter-btn {
            flex: 1;
            padding: 10px 0;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: #0f172a;
            color: #fff;
            border-color: #0f172a;
        }

        /* 카달로그 링크 버튼 영역 */
        .catalog-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .catalog-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            text-decoration: none;
            color: #1e293b;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }
        .catalog-btn:hover {
            background: #f1f5f9;
        }
        .catalog-btn span {
            color: #2563eb;
            font-size: 12px;
        }

        /* 맥 UI 스타일 하단 SNS 폴더 영역 */
        .mac-folder {
            background: #e2e8f0;
            border-radius: 14px;
            padding: 12px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 4px;
        }
        .sns-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #334155;
            font-size: 11px;
            gap: 4px;
            transition: transform 0.2s;
        }
        .sns-icon:hover {
            transform: translateY(-3px);
        }
        .sns-icon img {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 기존 명함 카드 UI -->
        <div class="card-box">
            <div class="card-logo">
                <img src="logo.png" alt="제이메디 로고">
            </div>
            <div class="card-divider"></div>
            <div class="card-info">
                <span class="name">김휘린</span>
                <div>Mobile | 010-5909-8573</div>
                <div>E-mail | greencomma77@naver.com</div>
                <div>Site | greencommagift.com</div>
                <div>Address | 부산 사상구 낙동대로839, 1층</div>
            </div>
        </div>

        <!-- 안내 타이틀 및 링크 -->
        <div class="header-section">
            <h1>2026 제이메디 카달로그</h1>
            <p>모바일 책자를 보시려면 링크를 클릭해 주세요.</p>
            <a href="https://noophihi.github.io" class="main-link" target="_blank">noophihi.github.io</a>
        </div>

        <!-- 제품별 카테고리 필터 버튼 -->
        <div class="filter-buttons">
            <button class="filter-btn active" onclick="filterCatalog('all', event)">전체 보기</button>
            <button class="filter-btn" onclick="filterCatalog('catalog1', event)">제이메디 책자</button>
            <button class="filter-btn" onclick="filterCatalog('catalog2', event)">역매품 책자</button>
        </div>

        <!-- 카달로그 링크 버튼 목록 -->
        <div class="catalog-links">
            <a href="catalog1.pdf" class="catalog-btn item-catalog1" target="_blank">
                <div>2026 제이메디 책자</div>
                <span>PDF 보기 &rarr;</span>
            </a>
            <a href="catalog2.pdf" class="catalog-btn item-catalog2" target="_blank">
                <div>2026 역매품 책자</div>
                <span>PDF 보기 &rarr;</span>
            </a>
        </div>

        <!-- 맥 UI 스타일 하단 SNS 폴더 영역 -->
        <div class="mac-folder">
            <a href="https://youtube.com" class="sns-icon" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube">
                <span>YouTube</span>
            </a>
            <a href="https://facebook.com" class="sns-icon" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/1384/1384053.png" alt="Facebook">
                <span>Facebook</span>
            </a>
            <a href="https://instagram.com" class="sns-icon" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/1384/1384063.png" alt="Instagram">
                <span>Instagram</span>
            </a>
            <a href="https://tiktok.com" class="sns-icon" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" alt="TikTok">
                <span>TikTok</span>
            </a>
        </div>
    </div>

    <script>
        // 카테고리 필터링 기능 스크립트
        function filterCatalog(type, event) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const item1 = document.querySelector('.item-catalog1');
            const item2 = document.querySelector('.item-catalog2');

            if (type === 'all') {
                item1.style.display = 'flex';
                item2.style.display = 'flex';
            } else if (type === 'catalog1') {
                item1.style.display = 'flex';
                item2.style.display = 'none';
            } else if (type === 'catalog2') {
                item1.style.display = 'none';
                item2.style.display = 'flex';
            }
        }
    </script>
</body>
</html>
